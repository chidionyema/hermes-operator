[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-operator"
version = "0.1.0"
description = "Operator shell for Hermes -- Telegram-driven estate ops, daemon control and remote coding."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# ruamel is used by utils.atomic_yaml_write for comment-preserving writes;
# it degrades to plain PyYAML when absent.
yaml-roundtrip = ["ruamel.yaml>=0.18"]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["hermes_constants", "utils"]

[tool.setuptools.packages.find]
include = ["gateway*"]

# Ported verbatim from hermes-agent/pyproject.toml:345-364 so that this repo and
# the monorepo lint identically. Deliberately NOT stricter: running default ruff
# here reports 19 F541/F401/E741 hits that the monorepo intentionally disables,
# and diverging would mean code that passes in one repo fails in the other.
[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) -- preview rule

[tool.ruff.lint]
# PLW1514 only. Bare open()/read_text()/write_text() in text mode defaults to the
# system locale encoding on Windows (cp1252 on US-locale installs), silently
# corrupting non-ASCII content. This rule caught notify_fanout.py:21 in the
# monorepo's first-ever CI run.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q keeps CI output to the verdict line; the suite runs in ~2s.
addopts = "-q"
